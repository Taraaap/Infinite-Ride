<!doctype html>
<title>Infinite Ride</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<div class="admin-otp-body">
    <div class="admin-otp-container">
        <h2>Admin OTP Verification</h2>
        <p>A 6-digit OTP has been sent to your email. Please enter it below.</p>

        {% if messages %}
        <div id="alert-message" class="alert alert-danger alert-dismissible fade show" role="alert" style="border: 2px solid red; background-color: #f8d7da; color: #721c24;">
            {% for message in messages %}
                <span>{{ message }}</span>
            {% endfor %}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form method="post" action="{% url 'admin_verify_otp' %}">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter OTP" required>
            <button type="submit">Verify</button>
        </form>

        <p><a href="{% url 'admin_reset_pass' %}"><strong>Resend OTP</strong></a></p>
    </div>
</div>

<style>
    .admin-otp-body {
        height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
    }

    .admin-otp-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        width: 350px;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #aaa;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #0056b3;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #0056b3;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }

    button:hover {
        background-color: #003f7f;
    }

    

    a:hover {
        text-decoration: underline;
        color: #0056b3;
    }
</style>

<!-- Admin Password Reset Modal -->
<div id="adminResetPasswordModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Reset Password</h2>


        <form id="adminResetPasswordForm" method="post" action="{% url 'admin_save_password' %}">
            {% csrf_token %}
            <input type="password" name="new_password" placeholder="Enter Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Save</button>
        </form>
    </div>
</div>

<script>
{% if otp_verified %}
    document.getElementById("adminResetPasswordModal").style.display = "flex";
{% endif %}

    document.querySelector(".close").addEventListener("click", function() {
        document.getElementById("adminResetPasswordModal").style.display = "none";
    });
</script>

<style>
/* Modal styles */
.modal {
    display: none;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 350px;
    text-align: center;
    position: relative;
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    cursor: pointer;
    font-size: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background-color: #003f7f;
}
</style>
