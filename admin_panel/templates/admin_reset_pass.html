<!doctype html>
<title>Infinite Ride</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="admin-password-reset-body">
    <div class="admin-password-reset-container">
        <h2>For OTP</h2>
        
        {% if messages %}
        <div id="alert-message" class="alert alert-danger alert-dismissible fade show" role="alert">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form method="post" action="{% url 'admin_reset_pass' %}">
            {% csrf_token %}
            <p>Enter valid email</p>
            <input type="email" name="email" placeholder="Admin Email" required>
            <button type="submit">Submit</button>
        </form>

        <p><a href="{% url 'admin_login' %}"><strong>Back to Admin Login</strong></a></p>
    </div>
</div>

<style>
    /* Background Styling */
    .admin-password-reset-body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #e3e5e8, #d5d6da);
        padding: 20px;
    }

    /* Container Styling */
    .admin-password-reset-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    /* Input Field Styling */
    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }
    input:focus {
        border-color: #0056b3;
        box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
    }

    /* Button Styling */
    button {
        width: 100%;
        padding: 12px;
        background-color: #0056b3;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }
    

    /* Link Styling */
    a {
        display: inline-block;
        margin-top: 10px;
        text-decoration: none;
        color: #d9534f;
        font-size: 14px;
    }
    a:hover {
        text-decoration: underline;
        color: #0056b3;
    }
</style>
