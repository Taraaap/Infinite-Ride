{% extends 'dashboard.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 500px;  
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-height: 600px;  
        overflow-y: auto; 
    }

    h1 {
        font-size: 18px; 
        color: #333;
        margin-bottom: 15px;  
        text-align: center;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        font-size: 14px;  /* Smaller label font */
    }

    input, textarea {
        width: 100%;
        padding: 6px; 
        margin-bottom: 10px;  
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;  /* Smaller input font */
        line-height: 1.2;  /* Reduced line height for compactness */
    }

    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    .button-container {
        display: flex;
        gap: 8px;  /* Reduced gap between buttons */
        justify-content: space-between;
        margin-top: 15px;  /* Reduced margin */
    }

    .btn {
        padding: 8px 12px;  /* Smaller button size */
        font-size: 14px;  /* Smaller button font size */
        cursor: pointer;
        border: none;
        border-radius: 4px;
    }

    .save-btn {
        background: #007bff;
        color: white;
    }

    .save-btn:hover {
        background: #0056b3;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    .delete-btn:hover {
        background: #c82333;
    }

    .back-btn {
        background: #6c757d;
        color: white;
    }

    .back-btn:hover {
        background: #5a6268;
    }
    .booking-date-time {
        font-size: 12px;
        color: #666;
        text-align: right;
        margin-top: 10px;
    }
</style>

<div class="form-container">
    <h1>Booking Details: {{ booking.id }}</h1>
    <div class="booking-date-time">
        <span>Booking  Time: {{ booking.booking_date|date:"Y-m-d H:i" }}</span>
    </div>
    

    <!-- Booking Edit Form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="user">User (Email)</label>
        <input type="email" id="user" name="user" value="{{ booking.user.email }}" required>

        <label for="phone_number">Phone Number</label>
        <input type="text" id="phone_number" name="phone_number" value="{{ booking.phone_number }}" required>

        <label for="start_date">Start Date</label>
        <input type="date" id="start_date" name="start_date" value="{{ booking.start_date|date:'Y-m-d' }}" required>

        <label for="end_date">End Date</label>
        <input type="date" id="end_date" name="end_date" value="{{ booking.end_date|date:'Y-m-d' }}" required>

        <label for="vehicle_type">Vehicle Type</label>
        <select id="vehicle_type" name="vehicle_type" required>
            <option value="car" {% if booking.get_vehicle_type == 'Car' %}selected{% endif %}>Car</option>
            <option value="bike" {% if booking.get_vehicle_type == 'Bike' %}selected{% endif %}>Bike</option>
            <option value="large_vehicle" {% if booking.get_vehicle_type == 'Large Vehicle' %}selected{% endif %}>Large Vehicle</option>
        </select>

        <label for="vehicle">Vehicle</label>
        <input type="text" id="vehicle" name="vehicle" value="{{ booking.get_vehicle }}" required>

        <label for="total_days">Total Days</label>
        <input type="number" id="total_days" name="total_days" value="{{ booking.total_days }}" required>

        <label for="total_amount">Total Amount</label>
        <input type="number" step="0.01" id="total_amount" name="total_amount" value="{{ booking.total_amount }}" required>

        <label for="status">Status</label>
        <select id="status" name="status" required>
            <option value="pending" {% if booking.status == 'pending' %}selected{% endif %}>Pending</option>
            <option value="confirmed" {% if booking.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
            <option value="cancelled" {% if booking.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
        </select>

        <label for="self_drive">
            <input type="checkbox" id="self_drive" name="self_drive" {% if booking.self_drive %}checked{% endif %}>
            Self Drive (for cars only)
        </label>
        
        {% if booking.license_document %}
            <a href="{{ booking.license_document.url }}" target="_blank">View License Document</a>
        {% endif %}

        <label for="drop_off_required">
            <input type="checkbox" id="drop_off_required" name="drop_off_required" {% if booking.drop_off_required %}checked{% endif %}>
            Drop-off Required
        </label>

        <label for="drop_off_address">Drop-off Address</label>
        <textarea id="drop_off_address" name="drop_off_address">{{ booking.drop_off_address }}</textarea>

        <label for="special_requirements">Special Requirements</label>
        <textarea id="special_requirements" name="special_requirements">{{ booking.special_requirements }}</textarea>

        <label for="is_completed">
            <input type="checkbox" id="is_completed" name="is_completed" {% if booking.is_completed %}checked{% endif %}>
            Mark as Completed
        </label>

        <label for="payment_status">Payment Status</label>
<select name="payment_status" id="payment_status">
    <option value="Unpaid" {% if booking.payment_status == "Unpaid" %}selected{% endif %}>Unpaid</option>
    <option value="Paid" {% if booking.payment_status == "Paid" %}selected{% endif %}>Paid</option>
</select>

        <div class="button-container">
            <button type="submit" class="btn save-btn">Save</button>
        </form>
            <form method="POST" onsubmit="return confirm('Are you sure you want to delete this booking?');">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete">
                <button type="submit" class="btn delete-btn">Delete</button>
            </form>
            

            <a href="{% url 'admin_booking' %}" class="btn back-btn">Back </a>
        </div>
    </form>
</div>
{% endblock %}
