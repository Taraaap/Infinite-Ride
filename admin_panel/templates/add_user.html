{% extends 'dashboard.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 500px;
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-height: 600px;
        overflow-y: auto;
    }

    h1 {
        font-size: 18px;
        color: #333;
        margin-bottom: 15px;
        text-align: center;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 6px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.2;
    }

    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    .button-container {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        margin-top: 15px;
    }

    .btn {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
    }

    .save-btn {
        background: #007bff;
        color: white;
    }

    .save-btn:hover {
        background: #0056b3;
    }

    .back-btn {
        background: #6c757d;
        color: white;
    }

    .back-btn:hover {
        background: #5a6268;
    }

</style>

<div class="form-container">
    <h1>Add New User</h1>

    <!-- Display success or error messages -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="color: green; font-weight: bold;">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Add User Form -->
    <form action="{% url 'add_user' %}" method="POST">
        {% csrf_token %}
        
        <label for="username">Name</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="password">Confirm Password</label>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="" required>


        <!-- <label for="is_active">
            <input type="checkbox" id="is_active" name="is_active">
            Active
        </label> -->

        <label for="is_staff">
            <input type="checkbox" id="is_staff" name="is_staff">
            Admin
        </label>

        <label for="is_superuser">
            <input type="checkbox" id="is_superuser" name="is_superuser">
            Superuser
        </label>

        <!-- Hidden Fields -->
        <input type="hidden" name="date_joined" value="{{ current_time }}">
        <input type="hidden" name="last_login" value="{{ current_time }}">

        <!-- Buttons in one line -->
        <div class="button-container">
            <button type="submit" class="btn save-btn">Save</button>
            <a href="{% url 'user' %}" class="btn back-btn">Back</a>
        </div>
    </form>
</div>
{% endblock %}
