{% extends 'dashboard.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 500px;  
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-height: 600px;  
        overflow-y: auto; 
    }

    h1 {
        font-size: 18px; 
        color: #333;
        margin-bottom: 15px;  
        text-align: center;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        font-size: 14px;  /* Smaller label font */
    }

    input, textarea {
        width: 100%;
        padding: 6px; 
        margin-bottom: 10px;  
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;  /* Smaller input font */
        line-height: 1.2;  /* Reduced line height for compactness */
    }

    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    .button-container {
        display: flex;
        gap: 8px;  /* Reduced gap between buttons */
        justify-content: space-between;
        margin-top: 15px;  /* Reduced margin */
    }

    .btn {
        padding: 8px 12px;  /* Smaller button size */
        font-size: 14px;  /* Smaller button font size */
        cursor: pointer;
        border: none;
        border-radius: 4px;
    }

    .save-btn {
        background: #007bff;
        color: white;
    }

    .save-btn:hover {
        background: #0056b3;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    .delete-btn:hover {
        background: #c82333;
    }

    .back-btn {
        background: #6c757d;
        color: white;
    }

    .back-btn:hover {
        background: #5a6268;
    }

    .img-preview {
        max-width: 30%; 
        height: auto;
        margin-top: 10px;
        border-radius: 4px;
        border: 1px solid #ddd;
        padding: 5px;
        display: block;
        margin-bottom: 10px;  
    }
</style>

<div class="form-container">
    <h1>{{ car.name }}</h1>

    <!-- Display success or error messages -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="color: green; font-weight: bold;">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Car Edit Form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="name">Car Name</label>
        <input type="text" id="name" name="name" value="{{ car.name }}" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" required>{{ car.description }}</textarea>

        <label for="price_per_day">Price per Day</label>
        <input type="number" id="price_per_day" name="price_per_day" value="{{ car.price_per_day }}" required>

        <label for="available">
            <input type="checkbox" id="available" name="available" {% if car.available %}checked{% endif %}>
            Available
        </label>

        <label for="featured_vehicle">
            <input type="checkbox" id="featured_vehicle" name="featured_vehicle" {% if car.featured_vehicle %}checked{% endif %}>
            Featured Vehicle
        </label>

        <label for="seating_capacity">Seating Capacity</label>
        <input type="number" id="seating_capacity" name="seating_capacity" value="{{ car.seating_capacity }}" required>

        <label for="fuel_type">Fuel Type</label>
        <input type="text" id="fuel_type" name="fuel_type" value="{{ car.fuel_type }}" required>

        <label for="transmission_type">Transmission Type</label>
        <input type="text" id="transmission_type" name="transmission_type" value="{{ car.transmission_type }}" required>

        

        <label for="image">Image</label>
        <input type="file" id="image" name="image">
        {% if car.image %}
            <img src="{{ car.image.url }}" alt="Car Image" class="img-preview">
        {% endif %}

        <!-- Buttons in one line -->
        <div class="button-container">
            <button type="submit" class="btn save-btn">Save</button>
        </form>
            <!-- Delete Car Form -->
            <form method="POST" onsubmit="return confirm('Are you sure you want to delete this car?');">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete">
                <button type="submit" class="btn delete-btn">Delete</button>
            </form>

            <a href="{% url 'car' %}" class="btn back-btn">Back</a>
        </div>
    </form>
</div>
{% endblock %}
