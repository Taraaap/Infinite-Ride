{% extends 'dashboard.html' %}

{% block content %}
<style>
     .form-container {
        max-width: 500px;  
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-height: 600px;  
        overflow-y: auto; 
    }

    h1 {
        font-size: 18px; 
        color: #333;
        margin-bottom: 15px;  
        text-align: center;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 6px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.2;
    }

    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    .button-container {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        margin-top: 15px;
    }

    .btn {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
    }

    .save-btn {
        background: #007bff;
        color: white;
    }

    .save-btn:hover {
        background: #0056b3;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    .delete-btn:hover {
        background: #c82333;
    }

    .back-btn {
        background: #6c757d;
        color: white;
    }

    .back-btn:hover {
        background: #5a6268;
    }

</style>

<div class="form-container">
    <h1>{{ user.username }}</h1>

    <!-- Display success or error messages -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="color: green; font-weight: bold;">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <!-- User Details Form -->
    <form method="POST">
        {% csrf_token %}
        
        <label for="username">Name</label>
        <input type="text" id="username" name="username" value="{{ user.username }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required>

       
        
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ user.phone|default:'' }}">

        <label for="is_staff">
            <input type="checkbox" id="is_staff" name="is_staff" {% if user.is_staff %}checked{% endif %}>
            Admin
        </label>

        <label for="is_superuser">
            <input type="checkbox" id="is_superuser" name="is_superuser" {% if user.is_superuser %}checked{% endif %}>
            Superuser
        </label>

        <label for="is_active">
            <input type="checkbox" id="is_active" name="is_active" {% if user.is_active %}checked{% endif %}>
            Active
        </label>

        <label for="last_login">Last Login</label>
        <input type="text" id="last_login" name="last_login" value="{{ user.last_login }}" disabled>

        <label for="date_joined">Date Joined</label>
        <input type="text" id="date_joined" name="date_joined" value="{{ user.date_joined }}" disabled>

        <div class="button-container">
            <button type="submit" class="btn save-btn">Save</button>
        </form>

            <form method="POST" onsubmit="return confirm('Are you sure you want to delete this user?');">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete">
                <button type="submit" class="btn delete-btn">Delete</button>
            </form>

            <a href="{% url 'user' %}" class="btn back-btn">Back</a>
        </div>
    </form>
</div>

{% endblock %}
