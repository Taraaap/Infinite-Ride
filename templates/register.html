<!doctype html>
{% extends "base.html" %}
{%block title%} Infinite Ride  {%endblock title%}


{% block  body %} 
<div class="signin-body">
    <div class="signin-container">
    <h2>Register</h2>
    <form id="signin-form" method="post"  action="{% url 'register' %}">
        {% csrf_token %}
        
        <input type="text" id="name" name="name" value="{{ name }}" placeholder="Full Name" required>
        <input type="email" id="email" name="email" value="{{ email }}" placeholder="Email" required>
        
        <input type="tel" id="phone" name="phone" value="{{ phone }}" placeholder="Phone Number" required oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="confirm Password" required>

        <button type="submit">Sign In</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}"><strong>Login</strong></a></p>
</div></div>



</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let alertCloseButtons = document.querySelectorAll(".alert .btn-close");
        alertCloseButtons.forEach(button => {
            button.addEventListener("click", function () {
                this.parentElement.style.display = "none";
            });
        });
    });
  </script>
